name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libgl1-mesa-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Test
        run: cargo test --release
      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: target/debian/*.deb

  release:
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/*.exe
            artifacts/ubuntu-deb/*.deb
          body: |
            **Windows:** download `FerrumPaint-*-Setup.exe` and run it. It's unsigned, so SmartScreen may warn: click More info, then Run anyway.
            **Ubuntu:** download the `.deb`, then `sudo apt install ./ferrum-paint_*_amd64.deb`.
            See [INSTALL.md](https://github.com/tlorne96/FerrumPaintDotNet/blob/main/INSTALL.md) for details.